[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:bird]
command=/run-bird.sh
priority=10
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:scheduler]
command=/run-scheduler.sh
priority=20
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:admin]
command=/run-admin.sh
priority=30
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/null
stderr_logfile=/dev/null
