name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  browser:
    name: Browser workflows (desktop and mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: python -m pip install --require-hashes -r deploy/requirements-dns.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
        working-directory: admin-ui
      - run: npx playwright install --with-deps chromium
        working-directory: admin-ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      - run: npm run test:e2e
        working-directory: admin-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: admin-ui/test-results

  javascript:
    name: JavaScript modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JavaScript tests
        run: node --test tests/js/admin-modules.test.mjs

  test:
    name: Tests and Docker checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r deploy/requirements-dns.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate canonical Compose file
        run: |
          docker compose --env-file .env.example config
          BGP_ANTIFILTER_IMAGE=bgp-antifilter:smoke ADMIN_PASSWORD=ci-test docker compose -f deploy/portainer-stack.yml config --quiet

      - name: Build canonical Docker image
        run: docker compose --env-file .env.example build

      - name: Test web application update and rollback
        run: RUN_DOCKER_WEB_UPDATE=1 WEB_UPDATE_TEST_IMAGE=ghcr.io/leonidoz/bgp-antifilter:dev python -m unittest tests.test_web_update_docker -v

      - name: Test correction from misnumbered 6.0.2 to 1.0.1
        run: RUN_DOCKER_WEB_UPDATE=1 WEB_UPDATE_VERSION_CORRECTION=1 WEB_UPDATE_TEST_IMAGE=ghcr.io/leonidoz/bgp-antifilter:dev python -m unittest tests.test_web_update_docker -v

      - name: Verify BIRD 3 BGP export and reconfiguration
        run: RUN_DOCKER_BGP=1 BGP_TEST_IMAGE=ghcr.io/leonidoz/bgp-antifilter:dev python -m unittest tests.test_bgp_docker -v

      - name: Verify FRR import policy and VPN next hop
        run: RUN_DOCKER_FRR=1 BGP_TEST_IMAGE=ghcr.io/leonidoz/bgp-antifilter:dev python -m unittest tests.test_frr_docker -v

      - name: Test persistent config volume migration
        run: RUN_DOCKER_CONFIG_MIGRATION=1 CONFIG_MIGRATION_IMAGE=ghcr.io/leonidoz/bgp-antifilter:dev python -m unittest tests.test_config_volume -v

      - name: Run Docker smoke test
        run: RUN_DOCKER_SMOKE=1 python -m unittest tests.test_smoke_docker -v

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck on canonical runtime scripts
        run: shellcheck -x deploy/*.sh
