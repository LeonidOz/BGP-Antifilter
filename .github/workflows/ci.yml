name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  javascript:
    name: JavaScript modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JavaScript tests
        run: node --test tests/js/admin-modules.test.mjs

  test:
    name: Tests and Docker checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate canonical Compose file
        run: |
          docker compose --env-file .env.example config
          BGP_ANTIFILTER_IMAGE=bgp-antifilter:smoke ADMIN_PASSWORD=ci-test docker compose -f deploy/portainer-stack.yml config --quiet

      - name: Build canonical Docker image
        run: docker compose --env-file .env.example build

      - name: Test persistent config volume migration
        run: RUN_DOCKER_CONFIG_MIGRATION=1 CONFIG_MIGRATION_IMAGE=bgp-antifilter:dev python -m unittest tests.test_config_volume -v

      - name: Run Docker smoke test
        run: RUN_DOCKER_SMOKE=1 python -m unittest tests.test_smoke_docker -v

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck on canonical runtime scripts
        run: shellcheck -x deploy/*.sh
