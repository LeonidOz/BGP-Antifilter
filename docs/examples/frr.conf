frr defaults traditional
hostname antifilter-router
log stdout
!
ip prefix-list ANTIFILTER-V4 seq 5 deny 0.0.0.0/0
ip prefix-list ANTIFILTER-V4 seq 10 permit 0.0.0.0/0 ge 8 le 32
bgp community-list standard ANTIFILTER permit 65432:500
!
route-map ANTIFILTER-IN permit 10
 match ip address prefix-list ANTIFILTER-V4
 match community ANTIFILTER
 set ip next-hop 10.10.10.1
exit
route-map ANTIFILTER-IN deny 100
exit
route-map ANTIFILTER-OUT deny 10
exit
!
router bgp 65455
 bgp router-id 192.168.55.1
 no bgp default ipv4-unicast
 neighbor 192.168.55.5 remote-as 64500
 neighbor 192.168.55.5 update-source 192.168.55.1
 neighbor 192.168.55.5 ebgp-multihop 2
 address-family ipv4 unicast
  neighbor 192.168.55.5 activate
  neighbor 192.168.55.5 route-map ANTIFILTER-IN in
  neighbor 192.168.55.5 route-map ANTIFILTER-OUT out
 exit-address-family
exit
